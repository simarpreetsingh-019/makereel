name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: install
        run: python -m pip install -e ".[dev]"
      - name: lint
        run: ruff check .
      - name: tests
        run: python -m pytest -q

  installer:
    name: one-command install (${{ matrix.os }})
    needs: tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: run install.sh (macOS / Linux)
        if: runner.os != 'Windows'
        env:
          MAKEREEL_SOURCE: ${{ github.workspace }}
          MAKEREEL_NO_LAUNCH: "1"
        run: bash install.sh
      - name: run install.ps1 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MAKEREEL_SOURCE: ${{ github.workspace }}
          MAKEREEL_NO_LAUNCH: "1"
        run: ./install.ps1
      - name: the web app starts and answers (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          cd ~/makereel
          makereel web --no-browser --port 8765 &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8765/api/v1/health && exit 0; sleep 2; done
          exit 1
      - name: the web app starts and answers (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:Path = "$env:USERPROFILE\.local\bin;$env:Path"
          Set-Location "$env:USERPROFILE\makereel"
          Start-Process makereel -ArgumentList "web","--no-browser","--port","8765" -NoNewWindow
          foreach ($i in 1..30) {
            try { Invoke-RestMethod http://127.0.0.1:8765/api/v1/health; exit 0 } catch { Start-Sleep 2 }
          }
          exit 1
