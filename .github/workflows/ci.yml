name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: install
        run: python -m pip install -e ".[dev]"
      - name: lint
        run: ruff check .
      - name: tests
        run: python -m pytest -q

  installer:
    name: one-command install (${{ matrix.os }})
    needs: tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: run install.sh (macOS / Linux)
        if: runner.os != 'Windows'
        env:
          MAKEREEL_SOURCE: ${{ github.workspace }}
          MAKEREEL_NO_LAUNCH: "1"
        run: cat install.sh | bash   # piped, exactly like `curl … | bash`
      - name: run install.ps1 (Windows PowerShell 5.1, the way `irm … | iex` runs it)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          MAKEREEL_SOURCE: ${{ github.workspace }}
          MAKEREEL_NO_LAUNCH: "1"
        run: |
          Get-Content -Raw -Encoding UTF8 install.ps1 | Invoke-Expression
          Write-Host "--- second run: uv is now installed and already on PATH (the case that used to stop it)"
          Get-Content -Raw -Encoding UTF8 install.ps1 | Invoke-Expression
          if (-not (Test-Path "$env:USERPROFILE\makereel\Start makereel.cmd")) { throw "launcher missing" }
          if (-not (Test-Path ([Environment]::GetFolderPath("Desktop") + "\makereel.lnk"))) { throw "desktop shortcut missing" }
      - name: the web app starts and answers (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          cd ~/makereel
          makereel web --no-browser --port 8765 &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8765/api/v1/health && exit 0; sleep 2; done
          exit 1
      - name: the web app starts and answers (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:Path = "$env:USERPROFILE\.local\bin;$env:Path"
          Set-Location "$env:USERPROFILE\makereel"
          Start-Process makereel -ArgumentList "web","--no-browser","--port","8765" -NoNewWindow
          foreach ($i in 1..30) {
            try { Invoke-RestMethod http://127.0.0.1:8765/api/v1/health; exit 0 } catch { Start-Sleep 2 }
          }
          exit 1

  # The real question: does it work on a computer with NO Python, Node or ffmpeg?
  empty-linux:
    name: install on an empty Linux (no Python, Node or ffmpeg)
    needs: tests
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - name: only the OS, curl and git (to read this checkout)
        run: |
          apt-get update -qq && apt-get install -y -qq curl git ca-certificates
          ! command -v python3 && ! command -v node && ! command -v ffmpeg && echo "confirmed: nothing installed"
      - uses: actions/checkout@v4
      - name: run install.sh
        env:
          MAKEREEL_SOURCE: ${{ github.workspace }}
          MAKEREEL_NO_LAUNCH: "1"
        run: cat install.sh | bash   # piped, exactly like `curl … | bash`
      - name: the web app starts and answers
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          cd ~/makereel
          makereel web --no-browser --port 8765 &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8765/api/v1/health && exit 0; sleep 2; done
          exit 1

  empty-windows:
    name: install on Windows with Python and Node hidden
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: hide Python and Node, then run install.ps1 (Windows PowerShell 5.1)
        shell: powershell
        env:
          MAKEREEL_SOURCE: ${{ github.workspace }}
          MAKEREEL_NO_LAUNCH: "1"
        run: |
          $keep = $env:Path -split ';' | Where-Object { $_ -and $_ -notmatch 'python|nodejs|node|hostedtoolcache' }
          $env:Path = $keep -join ';'
          foreach ($c in 'python', 'python3', 'node') {
            if (Get-Command $c -ErrorAction SilentlyContinue) { Write-Host "still visible: $c ($((Get-Command $c).Source))" }
          }
          Get-Content -Raw -Encoding UTF8 install.ps1 | Invoke-Expression
          $env:Path = "$env:USERPROFILE\.local\bin;$env:Path"
          makereel --version

  # No GPU on these machines, but the risky part is finding and loading NVIDIA's libraries, which works
  # without a GPU: install them the way `makereel gpu` does and check makereel's own check passes.
  gpu-libraries:
    name: NVIDIA GPU libraries load (${{ matrix.os }})
    needs: tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install makereel with its gpu extra
        run: python -m pip install ".[gpu]"
      - name: makereel finds and loads cuBLAS and cuDNN
        run: python -c "from makereel.core import gpu; ok = gpu.libs_ok(); print('libs_ok =', ok); assert ok"

  update-windows:
    name: makereel update (Windows PowerShell 5.1)
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: install, then update from GitHub the way `makereel update` does
        shell: powershell
        env:
          MAKEREEL_SOURCE: ${{ github.workspace }}
          MAKEREEL_NO_LAUNCH: "1"
          MAKEREEL_UPDATE_NO_WAIT: "1"
        run: |
          Get-Content -Raw -Encoding UTF8 install.ps1 | Invoke-Expression
          $env:Path = "$env:USERPROFILE\.local\bin;$env:Path"
          makereel update
          $result = Join-Path $env:TEMP "makereel-update.result"
          foreach ($i in 1..120) { if (Test-Path $result) { break }; Start-Sleep 5 }   # the helper finishes on its own
          if (-not (Test-Path $result)) { throw "the update helper never finished" }
          $code = (Get-Content $result).Trim()
          if ($code -ne "0") { throw "makereel update failed ($code)" }
          makereel --version
          makereel help | Select-String "makereel update"
