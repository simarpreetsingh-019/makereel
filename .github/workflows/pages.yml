name: website

# Publishes site/ (plus llms.txt and llms-full.txt from the repo root) to GitHub Pages.
on:
  push:
    branches: [main]
    paths: ["site/**", "llms.txt", "llms-full.txt", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: assemble the site
        run: mkdir -p _site && cp -r site/. _site/ && cp llms.txt llms-full.txt _site/ && touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
