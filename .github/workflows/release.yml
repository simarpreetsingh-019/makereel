name: release

# When a GitHub release is published: build the package and attach it with its SHA-256 checksum.
# The in-app updater installs only this wheel, and only if it matches the checksum.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: check the tag matches the version
        run: |
          v=$(python -c "import re;print(re.search(r'__version__ = \"(.+)\"', open('src/makereel/__init__.py').read()).group(1))")
          test "v$v" = "${{ github.event.release.tag_name }}" || { echo "tag ${{ github.event.release.tag_name }} != version $v"; exit 1; }
      - name: build
        run: python -m pip install build && python -m build
      - name: checksums
        run: cd dist && for f in *.whl; do sha256sum "$f" | cut -d' ' -f1 > "$f.sha256"; done && ls -la
      - name: attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.whl dist/*.whl.sha256 --clobber
