[project]
name = "makereel"
version = "0.7.0"
description = "Turn any live stream or video into captioned 9:16 reels with full creator credits"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "yt-dlp[default]>=2025.1.1",
  "faster-whisper>=1.0",
  "scenedetect>=0.6.4",
  "opencv-python>=4.8",   # face detection (YuNet) for follow-the-speaker and split screen
  "numpy",
  "psutil>=5.9",
  "anyascii>=0.3",   # English letters for non-Indian scripts (Indian ones use our own rules)
]

[project.optional-dependencies]
silence = ["auto-editor"]
ai = ["anthropic>=1.0"]
dev = ["pytest", "ruff"]

[project.scripts]
makereel = "makereel.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
makereel = ["web/*.html", "web/css/*", "web/js/*.js", "web/js/views/*.js"]

[tool.ruff]
line-length = 120
src = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E701", "E702", "E741", "B008"]

[tool.ruff.lint.per-file-ignores]
"src/makereel/core/captions.py" = ["E501"]   # ASS style lines must stay on one line
